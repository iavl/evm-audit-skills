name: Validate checklist corpus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Slither and solc
        run: |
          python3 -m pip install -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Verify generated checklists
        run: python3 scripts/generate_checklists.py --check
      - name: Validate registry and provenance
        run: python3 scripts/validate_checklists.py --strict
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
