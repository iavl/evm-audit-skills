name: Validate checklist corpus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-and-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify generated checklists
        run: |
          python3 -m pip install jsonschema==4.25.1
          python3 scripts/generate_checklists.py --check
      - name: Validate registry and provenance
        run: python3 scripts/validate_checklists.py --strict
      - name: Run routing regression benchmark
        run: python3 scripts/benchmark_routing.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Slither and solc
        run: |
          python3 -m pip install -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run focused hardening regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_code_context.py' -v
          python3 -m unittest discover -s tests -p 'test_compilation_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_hardening.py' -v
          python3 -m unittest discover -s tests -p 'test_runtime.py' -v
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

  windows-ledger:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ledger test dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Run Windows ledger-lock regressions
        run: python -m unittest discover -s tests -p 'test_runtime.py' -v

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check patch whitespace
        run: git diff --check
