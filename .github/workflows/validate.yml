name: Validate checklist corpus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither and solc
        run: |
          python3 -m pip install -r requirements-runtime.txt
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Verify generated checklists
        run: python3 scripts/generate_checklists.py --check
      - name: Validate registry and provenance
        run: python3 scripts/validate_checklists.py --strict
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run executable EVM semantics
        run: forge test --root tests/semantics -vv
      - name: Run EIP-6780 cross-transaction differential semantics
        run: |
          bash tests/semantics/test_eip6780_differential.sh paris
          bash tests/semantics/test_eip6780_differential.sh cancun
      - name: Check routing recall and token baselines
        run: python3 scripts/benchmark_routing.py
      - name: Check patch whitespace
        run: git diff --check
