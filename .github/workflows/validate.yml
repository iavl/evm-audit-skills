name: Validate checklist corpus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-and-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Verify generated checklists
        run: |
          python3 -m pip install --require-hashes -r requirements-runtime.lock
          python3 scripts/generate_checklists.py --check
      - name: Validate registry and provenance
        run: python3 scripts/validate_checklists.py --strict
      - name: Run routing regression benchmark
        run: python3 scripts/benchmark_routing.py

  fast-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime dependencies
        run: python3 -m pip install --require-hashes -r requirements-runtime.lock
      - name: Run fast unit layer
        run: python3 scripts/run_fast_tests.py

  controller-reporting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime and compiler dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run controller reporting shard
        run: python3 scripts/run_controller_tests.py --shard reporting

  controller-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime and compiler dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run controller lifecycle shard
        run: python3 scripts/run_controller_tests.py --shard lifecycle

  slither-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install Slither and compiler dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run Slither/compiler integration layer
        run: python3 scripts/run_slither_tests.py
      - name: Run code-context budget benchmark
        run: python3 scripts/benchmark_code_context.py

  windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Run platform and concurrency regressions
        run: python scripts/run_platform_tests.py

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check patch whitespace
        run: git diff --check
