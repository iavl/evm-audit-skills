name: Scheduled heavy quality

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Slither and solc
        run: |
          python3 -m pip install --require-hashes -r requirements-runtime.lock
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1
      - name: Record build provenance
        run: python3 scripts/build_info.py > build-info.json
      - name: Run routing benchmark and Recon-to-Selector E2E
        run: python3 scripts/benchmark_routing.py --e2e > routing-benchmark.jsonl
      - name: Run code-context size benchmark
        run: python3 scripts/benchmark_code_context.py > code-context-benchmark.jsonl
      - name: Run EIP-6780 cross-transaction differential semantics
        run: |
          bash tests/semantics/test_eip6780_differential.sh paris
          bash tests/semantics/test_eip6780_differential.sh cancun
      - name: Emit per-domain knowledge metrics
        run: python3 scripts/knowledge_metrics.py --output knowledge-metrics.json
      - name: Upload quality reproducibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-heavy-quality
          path: |
            build-info.json
            knowledge-metrics.json
            routing-benchmark.jsonl
            code-context-benchmark.jsonl
