name: Scheduled knowledge health

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1
      - name: Check freshness and official sources
        id: knowledge
        continue-on-error: true
        run: |
          python3 scripts/check_knowledge_health.py --check-links --output-json knowledge-health.json > knowledge-health.txt
      - name: Run executable semantic evidence
        id: semantics
        continue-on-error: true
        run: forge test --root tests/semantics -vv > semantic-tests.txt 2>&1
      - name: Create, update, or close the deduplicated issue
        uses: actions/github-script@v7
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          SEMANTICS_OUTCOME: ${{ steps.semantics.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Knowledge Health] Freshness or semantic evidence needs review';
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            const issue = existing.data.items.find(item => item.title === title);
            const failed = process.env.KNOWLEDGE_OUTCOME !== 'success' || process.env.SEMANTICS_OUTCOME !== 'success';
            if (!failed) {
              if (issue && issue.state === 'open') {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `Resolved by ${context.sha}. The scheduled freshness/source check and executable semantic suite both passed.`
                });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(0, 50000) : '(no output)';
            const body = [
              'The scheduled knowledge-health run found stale/unverified knowledge, a broken official source, or an executable semantic regression.',
              '',
              `- Commit: ${context.sha}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Freshness/source outcome: ${process.env.KNOWLEDGE_OUTCOME}`,
              `- Semantic suite outcome: ${process.env.SEMANTICS_OUTCOME}`,
              '',
              '<details><summary>Knowledge health</summary>',
              '',
              '```text', read('knowledge-health.txt'), '```',
              '</details>',
              '',
              '<details><summary>Semantic evidence</summary>',
              '',
              '```text', read('semantic-tests.txt'), '```',
              '</details>'
            ].join('\n');
            if (issue) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                body,
                state: 'open'
              });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Failure observed again at ${context.sha}; issue body refreshed from the latest scheduled run.`
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Fail the scheduled run when health checks fail
        if: steps.knowledge.outcome != 'success' || steps.semantics.outcome != 'success'
        run: exit 1
